[package]
name = "cifi-sim"
version = "0.1.0"
edition = "2021"
description = "OfflineHunt Monte Carlo simulator (Rust port of sim/)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
