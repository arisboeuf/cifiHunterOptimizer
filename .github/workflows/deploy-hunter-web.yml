name: Deploy Hunter Sim

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-hunter-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-hunter-sim
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a web/. _site/
          if [ ! -f _site/wasm/release.wasm ]; then
            mkdir -p _site/wasm
            curl -fsSL -o _site/wasm/release.wasm https://cifi-tools.com/wasm/release.wasm
          fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
